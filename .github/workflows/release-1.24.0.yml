name: Publish KarmaFlow 1.24.0
on:
  push:
    branches: [main]
    paths:
      - dist/KarmaFlow-1.24.0.apk
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-1.24.0
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and verify tested APK
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          curl --fail --location --retry 3 "https://raw.githubusercontent.com/${REPOSITORY}/${REVISION}/dist/KarmaFlow-1.24.0.apk" -o KarmaFlow-1.24.0.apk
          echo 'f2ebcf987a68c449c3b3151dee3422e39845758fdfed5ce74dae28e9ae8fdf4d  KarmaFlow-1.24.0.apk' | sha256sum --check
          curl --fail --location --retry 3 "https://raw.githubusercontent.com/${REPOSITORY}/${REVISION}/RELEASE-NOTES-1.24.0.md" -o notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          if gh release view v1.24.0 >/dev/null 2>&1; then
            echo 'Release v1.24.0 already exists; leaving it unchanged.'
            exit 0
          fi
          gh release create v1.24.0 KarmaFlow-1.24.0.apk --target "$REVISION" --title 'KarmaFlow 1.24.0 · Galaxy 界面与记账优化' --notes-file notes.md
